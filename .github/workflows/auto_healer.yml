name: 🚄 KTMTicBot Autonomous Self-Healing Engine (Auto-Fix -> Branch -> Verify -> Merge -> EC2 Deploy)

on:
  workflow_run:
    workflows:
      - "🚄 KTMTicBot CI & EC2 Auto-Deploy"
    types:
      - completed
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Optional failed GitHub Actions Run ID to diagnose and heal"
        required: false
        type: string
      ec2_error_log:
        description: "Optional runtime traceback/error log forwarded from EC2 container watchdog"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Auto-Healer & Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r module_auto_healer/requirements.txt

      - name: Collect Failure Log (CI Run or EC2 Runtime Crash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs.failed_run_id }}
          EC2_ERROR_LOG: ${{ inputs.ec2_error_log }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RUN_ID="${WORKFLOW_RUN_ID}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_RUN_ID" ]; then
            RUN_ID="$DISPATCH_RUN_ID"
          fi
          echo "TARGET_RUN_ID=${RUN_ID:-ec2-runtime}" >> "$GITHUB_ENV"

          if [ -n "$EC2_ERROR_LOG" ]; then
            printf "%s\n" "$EC2_ERROR_LOG" > /tmp/failed_run.log
          elif [ -n "$RUN_ID" ]; then
            gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > /tmp/failed_run.log 2>&1 || \
            gh run view "$RUN_ID" --repo "${{ github.repository }}" --log > /tmp/failed_run.log 2>&1 || \
            echo "Could not fetch logs via gh cli." > /tmp/failed_run.log
          else
            echo "Manual dispatch without run_id or ec2_error_log." > /tmp/failed_run.log
          fi

      - name: Run AI Diagnosis & Patch Generator
        id: healer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m module_auto_healer.healer \
            --mode heal-run \
            --run-id "${TARGET_RUN_ID:-manual}" \
            --workflow-name "KTMTicBot CI & EC2 Runtime" \
            --log-file /tmp/failed_run.log \
            --project-root .

      - name: Re-run Directly on Transient Error
        if: steps.healer.outputs.action == 'TRANSIENT_RERUN' && env.TARGET_RUN_ID != 'ec2-runtime'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Transient failure detected. Re-running failed jobs for run $TARGET_RUN_ID..."
          gh run rerun "$TARGET_RUN_ID" --repo "${{ github.repository }}" --failed || true

      - name: Create Fix Branch, Run Verification Suite, Merge & Trigger EC2 Deploy
        if: steps.healer.outputs.action == 'CODE_FIXED'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_FILE: ${{ steps.healer.outputs.target_file }}
          ROOT_CAUSE: ${{ steps.healer.outputs.root_cause }}
        run: |
          set -e
          BRANCH_NAME="auto-fix/run-${GITHUB_RUN_ID}"

          echo "1. Creating isolated fix branch: $BRANCH_NAME"
          git config user.name "ktm-auto-healer[bot]"
          git config user.email "auto-healer@smartinfralog.com"
          git checkout -b "$BRANCH_NAME"

          echo "2. Running Verification Gate (Bytecode Compile + Full Pytest Suite)..."
          python -m py_compile "$TARGET_FILE"
          python -m pytest tests/ -v

          echo "3. Committing verified fix to $BRANCH_NAME..."
          git add "$TARGET_FILE"
          git commit -m "fix(auto-heal): resolve failure in $TARGET_FILE" -m "Root cause: $ROOT_CAUSE"
          git push -u origin "$BRANCH_NAME"

          echo "4. Merging verified fix branch into main..."
          if gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "fix(auto-heal): automatic repair for $TARGET_FILE" \
            --body "Automated fix generated and verified by KTMTicBot Auto-Healer.\n\n**Root Cause:** $ROOT_CAUSE"; then
            gh pr merge "$BRANCH_NAME" --squash --delete-branch || (
              git checkout main && git merge --ff-only "$BRANCH_NAME" && git push origin main && git push origin --delete "$BRANCH_NAME"
            )
          else
            git checkout main
            git merge --ff-only "$BRANCH_NAME"
            git push origin main
            git push origin --delete "$BRANCH_NAME" || true
          fi

          echo "5. Triggering CI & EC2 Auto-Deploy on main..."
          gh workflow run "ci_and_deploy.yml" --ref main || true
